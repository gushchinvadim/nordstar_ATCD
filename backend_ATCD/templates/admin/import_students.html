{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div id="content-main">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <fieldset class="module aligned">
            <div class="form-row">
                <label for="excel_file">Excel файл со слушателями:</label>
                <input type="file" name="excel_file" id="excel_file" accept=".xlsx, .xls" required style="padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%;">
                <p class="help">Файл должен содержать колонки: surname, name, patronymic, sex, dob, snils, surname_latin, name_latin, profession, dcat_id, citizenship_code, email, is_active, aircraft_type, employee_id</p>
            </div>
        </fieldset>

        <div class="submit-row">
            <input type="submit" value="Импортировать" class="default" />
            <a href="{% url 'admin:index' %}" class="button">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
